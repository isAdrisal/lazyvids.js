<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test</title>
  <link rel="stylesheet" href="../dev/styles.css">
  <script src="../dev/lazyvids.js"></script>
</head>

<body>
  <main>
    <video class="hide-desktop" data-lazyvids preload="none" muted loop src="../dev/clouds.mp4"
      poster="../dev/clouds_poster.jpg" width="1440" height="1918" title="Timelapse of clouds over a building">
    </video>

    <video class="hide-mobile" data-lazyvids preload="none" muted loop src="../dev/flying.mp4#1"
      poster="../dev/flying_poster.webp" width="1920" height="1080" title="Flight over mountainous terrain">
    </video>

    <video data-lazyvids preload="none" muted loop poster="../dev/flying_poster.webp" width="1920" height="1080"
      title="Flight over mountainous terrain">
      <source src="../dev/flying.mp4#2" type="video/mp4">
    </video>
  </main>

  <script type="module">
    import { runTests } from '@web/test-runner-mocha';
    import { expect } from '@esm-bundle/chai';
    import { setViewport } from '@web/test-runner-commands';

    // window.scrollTo({top: document.body.scrollHeight})

    runTests(async () => {
      await setViewport({ width: 1200, height: 1000 });

      it('document has 3 videos', async () => {
        const videos = document.querySelectorAll('video');
        expect(videos.length).to.equal(3);
      });
    });
  </script>
</body>

</html>
