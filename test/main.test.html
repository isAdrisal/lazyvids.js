<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🫣</text></svg>"
    />

    <link rel="stylesheet" href="../dev/styles.css" />
    <script src="../dev/lazyvids.js"></script>
  </head>

  <body>
    <main>
      <video
        class="hide-desktop"
        data-lazyvids
        preload="none"
        muted
        loop
        src="../dev/clouds.webm"
        poster="../dev/clouds_poster.jpg"
        width="1440"
        height="1918"
        title="Timelapse of clouds over a building"
      ></video>

      <video
        class="hide-mobile"
        data-lazyvids
        preload="none"
        muted
        loop
        src="../dev/flying.webm?v=1"
        poster="../dev/flying_poster.webp"
        width="1920"
        height="1080"
        title="Flight over mountainous terrain"
      ></video>

      <video
        data-lazyvids
        preload="none"
        muted
        loop
        poster="../dev/flying_poster.webp"
        width="1920"
        height="1080"
        title="Flight over mountainous terrain"
      >
        <source src="../dev/flying.webm?v=2" type="video/mp4" />
      </video>
    </main>

    <script type="module">
      import { runTests } from "@web/test-runner-mocha";
      import { expect } from "@esm-bundle/chai";
      import { setViewport } from "@web/test-runner-commands";

      window.scrollTo({ top: document.body.scrollHeight });

      const sleep = (ms = 1000) => new Promise((res) => setTimeout(res, ms));

      runTests(async () => {
        await setViewport({ width: 1200, height: 1000 });
        await sleep();

        /** @type HTMLVideoElement[] */
        const videos = [...document.querySelectorAll("video")];

        it("document has 3 videos", async () => {
          expect(videos.length, "video count").to.equal(3);
        });

        it("has 2 visible videos on desktop", async () => {
          let count = 0;
          for (const video of videos) {
            const styles = getComputedStyle(video);
            if (styles.display !== "none") {
              count++;
            }
          }
          expect(count, "visible count").to.equal(2);
        });
      });
    </script>
  </body>
</html>
